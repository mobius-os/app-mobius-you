openapi: 3.1.0
info:
  title: Möbius local identity bridge
  version: 2.2.0
  description: The only identity contract exposed to the mini-app. Every route requires the app's reviewed identity_manage capability.
paths:
  /api/identity:
    get:
      operationId: readLocalIdentity
      security: [{ appBearer: [] }]
      responses:
        '200':
          description: Explicit local/account state. The local deployment is always present.
          content: { application/json: { schema: { $ref: '#/components/schemas/Identity' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/IdentityCapabilityRequired' }
  /api/identity/agent:
    get:
      operationId: readLocalAgentAccess
      description: Returns provider-neutral model aliases, public prices, current credit, trial state, and the non-interactive testing-retention notice.
      security: [{ appBearer: [] }]
      responses:
        '200':
          description: Available, signed-out, or temporarily unavailable model access.
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentAccess' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/IdentityCapabilityRequired' }
  /api/identity/agent/trial:
    post:
      operationId: activateLocalAgentTrial
      description: Activates the account's available model-credit trial. The retention notice is informational and is not an activation gate.
      security: [{ appBearer: [] }]
      responses:
        '200':
          description: Updated available model access.
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentAccessAvailable' } } }
        '409': { description: Signed out, ineligible, already activated, or the shared trial fund is empty. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/IdentityCapabilityRequired' }
  /api/identity/profile:
    patch:
      operationId: updateLocalIdentityProfile
      security: [{ appBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [handle], properties: { handle: { type: string, pattern: '^[a-z0-9_]{3,30}$' } } } } }
      responses:
        '200': { description: Updated identity, content: { application/json: { schema: { $ref: '#/components/schemas/AvailableIdentity' } } } }
        '409': { description: Signed out or handle unavailable. }
        '422': { description: Invalid handle or request body. }
        '502': { description: Account service unavailable. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/IdentityCapabilityRequired' }
  /api/identity/avatar:
    get:
      operationId: readLocalIdentityAvatar
      description: >-
        Proxies the trusted account avatar through the authenticated local
        bridge so the opaque app frame keeps its same-origin image CSP.
      security: [{ appBearer: [] }]
      responses:
        '200':
          description: JPEG, PNG, or WebP avatar bytes.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404': { description: Signed out or no profile picture is configured. }
        '502': { description: Account avatar unavailable, invalid, or oversized. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/IdentityCapabilityRequired' }
    post:
      operationId: updateLocalIdentityAvatar
      security: [{ appBearer: [] }]
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { type: object, additionalProperties: false, required: [avatar], properties: { avatar: { type: string, format: binary } } } } }
      responses:
        '200': { description: Updated identity, content: { application/json: { schema: { $ref: '#/components/schemas/AvailableIdentity' } } } }
        '409': { description: Signed out. }
        '413': { description: Image exceeds 5 MB. }
        '415': { description: Unsupported image type. }
        '422': { description: Missing multipart avatar field. }
        '502': { description: Account service unavailable. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/IdentityCapabilityRequired' }
  /api/identity/link/start:
    post:
      operationId: startLocalAccountLink
      security: [{ appBearer: [] }]
      description: Creates a PKCE attempt without preflighting the authorization URL. The configured client origin must be exact HTTPS or loopback.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [provider], properties: { provider: { type: string, enum: [google, apple] } } } } }
      responses:
        '200':
          description: Browser authorization details; the PKCE verifier remains local and encrypted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authorization_url, attempt, state, expires_at]
                properties:
                  authorization_url: { type: string, format: uri }
                  attempt: { type: string, pattern: '^[A-Za-z0-9_-]{16,512}$' }
                  state: { type: string, pattern: '^[A-Za-z0-9_-]{32,512}$' }
                  expires_at: { type: string, format: date-time }
        '409': { description: Managed/already-linked account or client-origin configuration error. }
        '422': { description: Unsupported provider or invalid request body. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/IdentityCapabilityRequired' }
  /api/identity/link/complete:
    post:
      operationId: completeLocalAccountLink
      security: [{ appBearer: [] }]
      description: Retryable local completion; the remote exchange is idempotent.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [code, state, attempt], properties: { code: { type: string }, state: { type: string }, attempt: { type: string } } } } }
      responses:
        '200': { description: Linked identity, content: { application/json: { schema: { $ref: '#/components/schemas/LinkedAvailable' } } } }
        '400': { description: Invalid or expired attempt. }
        '409': { description: Managed, already-linked, damaged, or concurrently completed account state. }
        '502': { description: Exchange unavailable; the local attempt is retained for retry. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/IdentityCapabilityRequired' }
  /api/identity/link:
    delete:
      operationId: unlinkLocalAccount
      security: [{ appBearer: [] }]
      responses:
        '204': { description: Revoked remotely and removed locally. }
        '409': { description: Managed deployments cannot unlink. }
        '502': { description: Revocation unconfirmed; the local link is retained. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/IdentityCapabilityRequired' }
  /api/identity/railway:
    get:
      operationId: readRailway
      description: >-
        Reads the Railway connection and deployments. Opt-in extensions are
        requested with query flags and ignored by hosts that predate them:
        region_options=1 adds the connection's region choices, and
        workspace_ids=1 adds each deployment's workspace_id (null until the host
        has recorded it) so the resource editor can use that workspace's plan
        limits. Without the flags the response keeps its original shape.
      security: [{ appBearer: [] }]
      parameters:
        - { name: region_options, in: query, required: false, schema: { type: string, enum: ['1'] } }
        - { name: workspace_ids, in: query, required: false, schema: { type: string, enum: ['1'] } }
      responses:
        '200': { description: The Railway connection and deployments. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/identity/railway/workspace-plans:
    get:
      operationId: readRailwayWorkspacePlans
      description: >-
        Lists each authorized Railway workspace with its own plan, deploy-blocked
        notice, and plan limits so the create form can choose a workspace itself.
        Requires the reviewed railway_manage grant. Platforms and launchers that
        predate the route fail it; the app then keeps the connection-wide
        workspace flow.
      security: [{ appBearer: [] }]
      responses:
        '200':
          description: Per-workspace plan data and the saved default workspace id.
          content: { application/json: { schema: { $ref: '#/components/schemas/RailwayWorkspacePlans' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/identity/railway/deployments:
    post:
      operationId: createRailwayDeployment
      description: >-
        Creates a deployment. Only the fields below are described here. Omit
        workspace_id to deploy into the saved default workspace.
      security: [{ appBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                workspace_id: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
components:
  securitySchemes:
    appBearer:
      type: http
      scheme: bearer
      description: Ordinary app-scoped token for the installed Identity app.
  responses:
    Unauthenticated:
      description: Missing or invalid app token.
    IdentityCapabilityRequired:
      description: The installed app lacks the reviewed identity_manage grant.
  schemas:
    AgentAccess:
      oneOf:
        - { $ref: '#/components/schemas/AgentAccessAvailable' }
        - { $ref: '#/components/schemas/AgentAccessInactive' }
    AgentAccessAvailable:
      type: object
      additionalProperties: false
      required: [agent_access, models, balance, trial, retention]
      properties:
        agent_access: { const: available }
        models:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AgentModel' }
        balance:
          type: object
          additionalProperties: false
          required: [available_units]
          properties:
            available_units: { type: integer, minimum: 0 }
            available_usd: { type: string, pattern: '^[0-9]+(?:\.[0-9]{1,6})?$' }
        trial:
          type: object
          additionalProperties: false
          required: [state]
          properties:
            state: { type: string, enum: [ready, active, expired, ineligible] }
        retention:
          type: object
          additionalProperties: false
          required: [policy, notice]
          properties:
            policy: { const: local-testing-v1 }
            notice: { type: string, minLength: 20, maxLength: 500 }
    AgentAccessInactive:
      type: object
      additionalProperties: false
      required: [agent_access, models, balance, trial, retention]
      properties:
        agent_access: { type: string, enum: [signed_out, unavailable] }
        models: { type: array, maxItems: 0 }
        balance: { type: object, maxProperties: 0 }
        trial: { type: object, maxProperties: 0 }
        retention: { type: object, maxProperties: 0 }
    AgentModel:
      type: object
      additionalProperties: false
      required: [id, name, pricing]
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,79}$' }
        name: { type: string, minLength: 1, maxLength: 80 }
        context_window: { type: integer, minimum: 1, maximum: 9007199254740991 }
        pricing:
          type: object
          additionalProperties: false
          required: [input, cached_input, output]
          properties:
            input: { type: number, minimum: 0 }
            cached_input: { type: number, minimum: 0 }
            output: { type: number, minimum: 0 }
    RailwayWorkspacePlans:
      type: object
      additionalProperties: false
      required: [workspaces, current]
      properties:
        workspaces:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/RailwayWorkspacePlan' }
        current: { anyOf: [{ type: string, minLength: 1, maxLength: 128 }, { type: 'null' }] }
    RailwayWorkspacePlan:
      type: object
      additionalProperties: false
      required: [id, name, plan, deploy_blocked, plan_limits]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 128 }
        plan: { type: string, enum: [trial, free, hobby, pro, enterprise, unknown] }
        deploy_blocked: { type: string, maxLength: 1000 }
        plan_limits: { $ref: '#/components/schemas/RailwayPlanLimits' }
    RailwayPlanLimits:
      type: object
      required: [cpu_choices, max_cpu, memory_options_mb, max_memory_mb, volume_options_mb, default_volume_mb]
      properties:
        cpu_choices: { type: array, items: { type: integer, minimum: 1 } }
        max_cpu: { type: integer, minimum: 1 }
        default_cpu: { type: integer, minimum: 1 }
        memory_options_mb: { type: array, items: { type: integer, minimum: 1 } }
        max_memory_mb: { type: integer, minimum: 1 }
        default_memory_mb: { type: integer, minimum: 1 }
        volume_options_mb: { type: array, items: { type: integer, minimum: 1 } }
        default_volume_mb: { type: integer, minimum: 1 }
        included_usd: { anyOf: [{ type: number }, { type: 'null' }] }
    Identity:
      oneOf:
        - { $ref: '#/components/schemas/SignedOut' }
        - { $ref: '#/components/schemas/LinkedAvailable' }
        - { $ref: '#/components/schemas/LinkedUnavailable' }
        - { $ref: '#/components/schemas/ManagedAvailable' }
        - { $ref: '#/components/schemas/ManagedUnavailable' }
    AvailableIdentity:
      oneOf:
        - { $ref: '#/components/schemas/LinkedAvailable' }
        - { $ref: '#/components/schemas/ManagedAvailable' }
    SignedOut:
      type: object
      additionalProperties: false
      required: [account_mode, account_unavailable, instance_id, profile, deployments]
      properties:
        account_mode: { const: signed_out }
        account_unavailable: { const: false }
        instance_id: { type: 'null' }
        profile: { type: 'null' }
        deployments: { $ref: '#/components/schemas/LocalDeployments' }
    LinkedAvailable:
      type: object
      additionalProperties: false
      required: [account_mode, account_unavailable, instance_id, profile, deployments]
      properties:
        account_mode: { const: linked }
        account_unavailable: { const: false }
        instance_id: { type: 'null' }
        profile: { $ref: '#/components/schemas/Profile' }
        deployments: { $ref: '#/components/schemas/LocalDeployments' }
    LinkedUnavailable:
      type: object
      additionalProperties: false
      required: [account_mode, account_unavailable, instance_id, profile, deployments]
      properties:
        account_mode: { const: linked }
        account_unavailable: { const: true }
        instance_id: { type: 'null' }
        profile: { type: 'null' }
        deployments: { $ref: '#/components/schemas/LocalDeployments' }
    ManagedAvailable:
      type: object
      additionalProperties: false
      required: [account_mode, account_unavailable, instance_id, profile, deployments]
      properties:
        account_mode: { const: managed }
        account_unavailable: { const: false }
        instance_id: { type: string, minLength: 1 }
        profile: { $ref: '#/components/schemas/ManagedProfile' }
        deployments:
          type: array
          minItems: 1
          maxItems: 100
          contains: { type: object, required: [current], properties: { current: { const: true } } }
          items: { $ref: '#/components/schemas/BridgeDeployment' }
    ManagedUnavailable:
      type: object
      additionalProperties: false
      required: [account_mode, account_unavailable, instance_id, profile, deployments]
      properties:
        account_mode: { const: managed }
        account_unavailable: { const: true }
        instance_id: { type: string, minLength: 1 }
        profile: { $ref: '#/components/schemas/DegradedManagedProfile' }
        deployments: { $ref: '#/components/schemas/LocalDeployments' }
    LocalDeployments:
      type: array
      minItems: 1
      maxItems: 100
      contains: { type: object, required: [current], properties: { current: { const: true } } }
      items: { $ref: '#/components/schemas/BridgeDeployment' }
    BridgeDeployment:
      type: object
      additionalProperties: false
      required: [id, name, status, url]
      properties:
        id: { type: string, maxLength: 96 }
        name: { type: string, maxLength: 128 }
        status: { type: string, enum: [Active, Linked] }
        region: { anyOf: [{ type: string, maxLength: 64 }, { type: 'null' }] }
        url: { type: string, format: uri }
        current: { type: boolean }
    Profile:
      type: object
      additionalProperties: false
      required: [user_id, email, display_name, handle, avatar_url]
      properties:
        user_id: { type: string, minLength: 1 }
        email: { type: string, format: email }
        display_name: { type: string }
        handle: { anyOf: [{ type: string, pattern: '^[a-z0-9_]{3,30}$' }, { type: 'null' }] }
        avatar_url: { anyOf: [{ type: string, format: uri }, { type: 'null' }] }
    ManagedProfile:
      type: object
      additionalProperties: false
      required: [user_id, email, display_name, handle, avatar_url]
      properties:
        user_id: { type: string, minLength: 1 }
        email: { anyOf: [{ type: string, format: email }, { type: 'null' }] }
        display_name: { type: string }
        handle: { anyOf: [{ type: string, pattern: '^[a-z0-9_]{3,30}$' }, { type: 'null' }] }
        avatar_url: { anyOf: [{ type: string, format: uri }, { type: 'null' }] }
    DegradedManagedProfile:
      type: object
      additionalProperties: false
      required: [user_id, email, display_name, handle, avatar_url]
      properties:
        user_id: { type: string, minLength: 1 }
        email: { anyOf: [{ type: string, format: email }, { type: 'null' }] }
        display_name: { type: 'null' }
        handle: { type: 'null' }
        avatar_url: { type: 'null' }
